<header class="head">
  @if (editing()) {
    <input
      class="head__field"
      #field
      type="text"
      [value]="column().name"
      [attr.aria-label]="t().board.columnName"
      (keydown)="onKeydown($event)"
      (blur)="confirm()"
    />
  } @else {
    <span class="head__dot head__dot--{{ tone() % 4 }}" aria-hidden="true"></span>
    <h2 class="head__name">{{ column().name }}</h2>
    <span class="head__count">{{ count() }}</span>

    <div class="head__menu-wrap">
      <button
        class="head__btn"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        [attr.aria-label]="column().name + ' ' + t().board.editColumn"
        (click)="toggleMenu()"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 6h.01M12 12h.01M12 18h.01" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" />
        </svg>
      </button>

      @if (menuOpen()) {
        <div class="head__menu" role="menu">
          <button class="head__menu-item" type="button" role="menuitem" (click)="startEdit()">
            {{ t().board.rename }}
          </button>
          <button
            class="head__menu-item head__menu-item--danger"
            type="button"
            role="menuitem"
            (click)="requestRemove()"
          >
            {{ t().board.deleteColumn }}
          </button>
        </div>
      }
    </div>

    <button
      class="head__btn"
      type="button"
      [attr.aria-label]="t().board.newTask + ': ' + column().name"
      (click)="added.emit()"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
  }
</header>
