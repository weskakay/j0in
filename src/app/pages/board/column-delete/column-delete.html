@if (count() === 0) {
  <p class="wipe__text">„{{ column().name }}" {{ t().board.columnEmpty }}</p>
} @else {
  <p class="wipe__text">
    „{{ column().name }}": <strong>{{ count() }} {{ t().summary.tasksUnit }}</strong>.
    {{ t().board.stillHolds }}
  </p>

  @if (targets().length > 0) {
    <label class="wipe__field">
      <span class="wipe__label">{{ t().board.moveTo }}</span>
      <select class="wipe__select" (change)="pick($event)">
        <option value="">{{ t().board.deleteWithColumn }}</option>
        @for (target of targets(); track target.id) {
          <option [value]="target.id">{{ target.name }}</option>
        }
      </select>
    </label>
  }

  @if (moveTo() === '') {
    <p class="wipe__warning" role="alert">
      {{ t().board.warnDeletes }}
    </p>
  }
}

<footer class="wipe__actions">
  <button class="wipe__btn" type="button" (click)="cancelled.emit()">{{ t().common.cancel }}</button>
  <button
    class="wipe__btn wipe__btn--danger"
    type="button"
    [disabled]="busy()"
    (click)="confirm()"
  >
    {{ busy() ? t().board.deleting : t().board.deleteColumn }}
  </button>
</footer>
