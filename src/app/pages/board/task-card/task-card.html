@if (!preview()) {
  <span
    class="card__grip"
    data-drag-handle
    aria-hidden="true"
    [title]="t().board.moveCard"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
    </svg>
  </span>

  @if (tracking()) {
    <button
      class="card__timer"
      type="button"
      [class.card__timer--running]="running()"
      [attr.aria-label]="(running() ? t().time.stopOn : t().time.startOn) + ' ' + task().title"
      [disabled]="busy()"
      (click)="toggleTimer()"
    >
      @if (running()) {
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M8 5.5v13l10.5-6.5z" fill="currentColor" />
        </svg>
      }
    </button>
  }
}

<button
  class="card"
  type="button"
  [attr.tabindex]="preview() ? -1 : null"
  (click)="activate()"
  (keydown)="keyed.emit($event)"
>
  @if (category(); as label) {
    <span class="card__category" [style.background]="label.color">{{ label.name }}</span>
  }

  <h3 class="card__title">{{ task().title }}</h3>

  @if (task().description) {
    <p class="card__text">{{ task().description }}</p>
  }

  @if (task().subtasks.length > 0) {
    <p class="card__progress">
      <span class="card__bar" aria-hidden="true">
        <span class="card__bar-fill" [style.width.%]="percent()"></span>
      </span>
      <span class="card__progress-label">
        {{ done() }}/{{ task().subtasks.length }} {{ t().task.subtasks }}
      </span>
    </p>
  }

  @if (tracking() && (seconds() > 0 || running())) {
    <p class="card__time" [class.card__time--running]="running()">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 9v4l2.5 2M10 2h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <span>{{ timeLabel() }}</span>
      @if (running()) {
        <span class="card__time-state">{{ t().time.running }}</span>
      }
    </p>
  }

  <span class="card__foot">
    <span class="card__people">
      @for (person of assignees(); track person.id) {
        <span class="card__avatar" [style.background]="person.color" [title]="person.name" role="img" [attr.aria-label]="person.name">
          {{ initials(person) }}
        </span>
      }
    </span>
    @if (dueText(); as due) {
      <span class="card__due card__due--{{ dueState() }}">{{ due }}</span>
    }
    <span class="card__prio card__prio--{{ task().priority }}">
      {{ priority() }}
    </span>
  </span>
</button>
