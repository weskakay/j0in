<header class="insights__head">
  <h1 class="insights__title">{{ t().insights.title }}</h1>
  <p class="insights__sub">{{ t().insights.sub }}</p>
</header>

@if (loading() && !ready()) {
  <app-loader [label]="t().common.loading" />
}

@if (ready()) {
  <app-widget [heading]="t().insights.charts">
    <div class="charts">
      <app-donut [caption]="t().charts.byPriority" [unit]="t().charts.tasksUnit" [rows]="byPriority()" />
      <app-bars [caption]="t().charts.byColumn" [rows]="byColumn()" />
      <app-segments class="charts__wide" [caption]="t().charts.byDeadline" [rows]="byDeadline()" />
    </div>
  </app-widget>
}
