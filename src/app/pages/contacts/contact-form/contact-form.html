<form class="cform" [formGroup]="form" (ngSubmit)="save()">
  <label class="cform__field">
    <span class="cform__label">{{ t().contacts.name }}</span>
    <input class="cform__input" type="text" formControlName="name" autocomplete="off" />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <span class="cform__hint" role="alert">{{ t().contacts.nameMissing }}</span>
    }
  </label>

  <label class="cform__field">
    <span class="cform__label">{{ t().contacts.email }}</span>
    <input class="cform__input" type="email" formControlName="email" autocomplete="off" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <span class="cform__hint" role="alert">{{ t().contacts.emailInvalid }}</span>
    }
  </label>

  <label class="cform__field">
    <span class="cform__label">{{ t().contacts.phone }}</span>
    <input class="cform__input" type="tel" formControlName="phone" autocomplete="off" />
  </label>

  <footer class="cform__actions">
    <button class="cform__btn" type="button" (click)="cancelled.emit()">{{ t().common.cancel }}</button>
    <button class="cform__btn cform__btn--primary" type="submit" [disabled]="saving()">
      {{ saving() ? t().contacts.saving : saveLabel() }}
    </button>
  </footer>
</form>
