<fieldset class="swatches">
  <legend class="swatches__caption">{{ caption() }}</legend>
  <span class="swatches__row">
    @for (swatch of swatches; track swatch.value) {
      <button
        class="swatches__item"
        type="button"
        [class.swatches__item--on]="value() === swatch.value"
        [style.background]="swatch.value"
        [attr.aria-label]="swatch.label"
        [attr.aria-pressed]="value() === swatch.value"
        (click)="picked.emit(swatch.value)"
      ></button>
    }
    @if (customLabel()) {
      <label
        class="swatches__item swatches__custom"
        [class.swatches__item--on]="custom()"
        [class.swatches__custom--set]="custom()"
        [style.--custom]="custom() ? value() : null"
      >
        <input
          class="swatches__input"
          type="color"
          [value]="customStart()"
          [attr.aria-label]="custom() ? customLabel() + ': ' + value() : customLabel()"
          (change)="pickCustom($event)"
        />
      </label>
    }
  </span>
</fieldset>
