<div class="shell" [class.shell--folded]="navFolded()">
  <a class="shell__brand" routerLink="/board">
    <span class="shell__brand-mark">J<span class="shell__brand-zero">0</span>IN</span>
  </a>

  <header class="shell__header">
    <div class="shell__lang" role="group" [attr.aria-label]="t().common.language">
      <button
        class="shell__lang-btn"
        type="button"
        [class.shell__lang-btn--on]="lang() === 'de'"
        [attr.aria-pressed]="lang() === 'de'"
        (click)="setLang('de')"
      >
        DE
      </button>
      <button
        class="shell__lang-btn"
        type="button"
        [class.shell__lang-btn--on]="lang() === 'en'"
        [attr.aria-pressed]="lang() === 'en'"
        (click)="setLang('en')"
      >
        EN
      </button>
    </div>

    <div class="shell__account">
      <button
        class="shell__avatar"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        [attr.aria-label]="t().nav.account"
        (click)="toggleMenu()"
      >
        {{ initials() }}
      </button>

      @if (menuOpen()) {
        <div class="shell__menu" role="menu">
          <p class="shell__menu-name">{{ user()?.name }}</p>
          <p class="shell__menu-mail">{{ user()?.email }}</p>
          <button class="shell__menu-item" type="button" role="menuitem" (click)="signOut()">
            {{ t().nav.logout }}
          </button>
        </div>
      }
    </div>
  </header>

  <nav
    class="shell__nav"
    [class.shell__nav--folded]="navFolded()"
    [attr.aria-label]="t().nav.label"
  >
    <button
      class="shell__fold"
      type="button"
      [attr.aria-label]="navFolded() ? t().nav.unfold : t().nav.fold"
      [attr.aria-pressed]="navFolded()"
      (click)="toggleNav()"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path [attr.d]="navFolded() ? 'M9 6l6 6-6 6' : 'M15 6l-6 6 6 6'" stroke="currentColor"
          stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>

    <ul class="shell__nav-list">
      @for (item of items; track item.path) {
        <li>
          <a
            class="shell__nav-link"
            [routerLink]="item.path"
            routerLinkActive="shell__nav-link--active"
            [attr.aria-label]="navFolded() ? t().nav[item.key] : null"
            [attr.title]="navFolded() ? t().nav[item.key] : null"
            (click)="closeMenu()"
          >
            <svg class="shell__nav-icon" viewBox="0 0 24 24" width="20" height="20"
              aria-hidden="true">
              <path [attr.d]="item.icon" stroke="currentColor" stroke-width="2" fill="none"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="shell__nav-text">{{ t().nav[item.key] }}</span>
            @if (item.path === '/settings' && pending() > 0) {
              <span class="shell__badge" [attr.aria-label]="pending() + ' ' + t().nav.pending">
                {{ pending() }}
              </span>
            }
          </a>
        </li>
      }
    </ul>

  </nav>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
