<div class="dialog" [class.dialog--side]="side()">
  <button class="dialog__backdrop" type="button" [attr.aria-label]="t().common.close" (click)="close()">
  </button>

  <div
    class="dialog__panel"
    #panel
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="heading()"
    tabindex="-1"
    (keydown)="onKeydown($event)"
  >
    <header class="dialog__head">
      <h2 class="dialog__title">{{ heading() }}</h2>
      <button class="dialog__close" type="button" [attr.aria-label]="t().common.close" (click)="close()">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            d="M6 6l12 12M18 6L6 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <div class="dialog__body">
      <ng-content />
    </div>
  </div>
</div>
