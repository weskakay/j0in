<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>J0IN</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applies the stored theme before the first paint, so nothing flashes.
    try {
      var r = document.documentElement;
      var t = localStorage.getItem('j0in-theme');
      if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
      var a = localStorage.getItem('j0in-accent');
      if (a && /^#[0-9a-f]{6}$/i.test(a)) {
        r.style.setProperty('--j0in-accent', a);
        r.style.setProperty('--j0in-accent-hover', 'color-mix(in srgb, ' + a + ' 82%, black)');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
