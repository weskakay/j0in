<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>J0IN</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applies the stored theme before the first paint, so nothing flashes.
    try {
      var t = localStorage.getItem('j0in-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
